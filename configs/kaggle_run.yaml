# Sửa file này rồi push; trên Kaggle chỉ cần Save Version (notebooks/kaggle_train.ipynb).
# Mỗi run ghi vào /kaggle/working/runs/<name>. Trên T4×2 hai run seg chạy song song, mỗi run một GPU.
# Chạy tiếp: Add Input output của version trước — run nào có runs/<name>/last.pt sẽ tự chạy tiếp.
#
# E1/E2 (V6, commit 35dc4f8) và E6/E7 (T08): cùng giao thức, cùng khởi tạo backbone ImageNet (D3),
# 100 epoch theo configs/base.yaml.
runs:
  # So sánh với mô hình thị giác–ngôn ngữ (đề nghị của thầy, 17/11): phát hiện vật cản trên tập con MODS
  # (configs/mods_vlm_subset.txt: 12 sequence, 1161 khung). Cần Add Input: dataset private chứa tập con MODS
  # (mods.json + sequences/<seq>/frames/*L.jpg) và Kaggle Model "PaliGemma 2" (transformers, paligemma2-3b-mix-448).
  # Chấm trên laptop: tools/boxes_to_mods.py → tools/eval_mods.py --sequences $(cat configs/mods_vlm_subset.txt).
  - name: vlm_owlv2              # ViT của Google + văn bản (open-vocabulary detector)
    kind: vlm
    model: owlv2
  - name: vlm_qwen25vl           # Qwen2.5-VL-3B
    kind: vlm
    model: qwen25vl
  - name: vlm_paligemma2         # SigLIP (Google) + Gemma 2B
    kind: vlm
    model: paligemma2
    model_glob: "**/paligemma2-3b-mix-448/*"
  # T03 (xong, Kaggle V10, commit 08d8f18): e1_ewasr_paper, e7_ewasr_h_lite_paper — công thức bài eWaSR.
  # T09 (xong, Kaggle V9, commit 9a0bd11): e7_ewasr_h_lite_lars, e1_ewasr_lars — data.dataset=lars
  # Smoke trước khi tốn GPU:
  # - name: smoke_ewasr_h
  #   kind: seg
  #   config: configs/ewasr_h.yaml
  #   set: ["train.epochs=2", "model.init_weights=null"]
  # Run YOLOv8n (set = tham số CLI của Ultralytics):
  # - name: yolov8n_usv_vn
  #   kind: yolo
  #   set: ["epochs=100", "imgsz=640"]
time_limit_h: 11                 # dừng an toàn trước giới hạn 12 giờ
export_onnx: true
eval_usv: true                   # thiếu dataset USV-VN thì cảnh báo và bỏ qua, không lỗi
