# Sửa file này rồi push; trên Kaggle chỉ cần Save Version (notebooks/kaggle_train.ipynb).
# Mỗi run ghi vào /kaggle/working/runs/<name>. Trên T4×2 hai run seg chạy song song, mỗi run một GPU.
# Chạy tiếp: Add Input output của version trước — run nào có runs/<name>/last.pt sẽ tự chạy tiếp.
#
# E1/E2 (V6, commit 35dc4f8) và E6/E7 (T08): cùng giao thức, cùng khởi tạo backbone ImageNet (D3),
# 100 epoch theo configs/base.yaml.
runs:
  # S2: huấn luyện lặp E2 (eWaSR + D mixer) và E6 (eWaSR-Lite, S mixer), seed 1 và 2 — cùng giao thức
  # seed 0 (E2: V6, E6: T08), để Bảng 3 của bài có trung bình ± độ lệch chuẩn cho cả 4 biến thể.
  - name: e2_ewasr_h_s1
    kind: seg
    config: configs/ewasr_h.yaml
    set: ["model.init_weights=null", "train.seed=1"]
  - name: e6_ewasr_lite_s1
    kind: seg
    config: configs/ewasr.yaml
    set: ["model.name=ewasr_lite", "model.init_weights=null", "train.seed=1"]
  - name: e2_ewasr_h_s2
    kind: seg
    config: configs/ewasr_h.yaml
    set: ["model.init_weights=null", "train.seed=2"]
  - name: e6_ewasr_lite_s2
    kind: seg
    config: configs/ewasr.yaml
    set: ["model.name=ewasr_lite", "model.init_weights=null", "train.seed=2"]
  # T03 (xong, Kaggle V10): e1_ewasr_paper, e7_ewasr_h_lite_paper — công thức bài eWaSR (fp32, batch 16,
  #   tối đa 200 epoch, early stopping patience 20 theo val loss)
  # S1 (xong, commit 97924a2): e1_ewasr_s1/s2, e7_ewasr_h_lite_s1/s2 — "train.seed=1|2"
  # T09 (xong, Kaggle V9, commit 9a0bd11): e7_ewasr_h_lite_lars, e1_ewasr_lars — data.dataset=lars
  # Smoke trước khi tốn GPU:
  # - name: smoke_ewasr_h
  #   kind: seg
  #   config: configs/ewasr_h.yaml
  #   set: ["train.epochs=2", "model.init_weights=null"]
  # Run YOLOv8n (set = tham số CLI của Ultralytics):
  # - name: yolov8n_usv_vn
  #   kind: yolo
  #   set: ["epochs=100", "imgsz=640"]
time_limit_h: 11                 # dừng an toàn trước giới hạn 12 giờ
export_onnx: true
eval_usv: true                   # thiếu dataset USV-VN thì cảnh báo và bỏ qua, không lỗi
